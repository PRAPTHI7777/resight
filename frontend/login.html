<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | ReSight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="shared.css">
</head>
<body class="login-page">
  <a class="auth-brand" href="home.html">ReSight<span>.</span></a>

  <form class="login-card" id="loginForm">
    
    
    <h2>Welcome back</h2>
    <input id="email" type="email" class="login-input" autocomplete="username" aria-label="Email" placeholder="Email" required>
    <input id="password" type="password" class="login-input" autocomplete="current-password" aria-label="Password" placeholder="Password" required>
    
    <div class="login-options">
      <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
    </div>
    
   <button id="loginBtn" class="login-btn" type="submit">Login</button>
   <p id="message" role="status"></p>
   <p class="noacc"> Don't have an account? <a href="signup.html" class="signup-link">Sign Up</a></p>
  </form>
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="login.js"></script>
</body>

</html>
