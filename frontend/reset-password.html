<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | ReSight</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="shared.css">
</head>

<body class="login-page">
    <a class="auth-brand" href="home.html">ReSight<span>.</span></a>

    <form id="resetForm" class="login-card">

        <h2>Reset Password</h2>

        <input
            id="newPassword"
            type="password"
            class="login-input"
            autocomplete="new-password"
            aria-label="New password"
            placeholder="New Password"
            minlength="8"
            required
        >

        <input
            id="confirmPassword"
            type="password"
            class="login-input"
            autocomplete="new-password"
            aria-label="Confirm new password"
            placeholder="Confirm Password"
            minlength="8"
            required
        >

        <button type="submit" class="login-btn">
            Reset Password
        </button>

        <p id="message" role="status" aria-live="polite"></p>

    </form>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="reset-password.js"></script>

</body>

</html>
