<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile | Resight</title>

    <link rel="stylesheet" href="profile.css">
    <link rel="stylesheet" href="shared.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

</head>


<body>

<div class="issue-ribbon"><span>THE RESEARCH READER</span><span>YOUR PERSONAL DESK</span><span>PROFILE / 01</span></div>
<header class="site-header">
    <a class="nav-logo" href="home.html"><span class="logo-mark" aria-hidden="true">R</span>ReSight<span class="logo-period">.</span></a>
    <nav aria-label="Main navigation">
        <a href="home.html">Home</a>
        <a href="index.html">Research feed</a>
        <a href="bookmarks.html">Bookmarks</a>
        <a href="likes.html">Likes</a>
        <a class="active" href="profile.html">Profile</a>
    </nav>
</header>


<main class="profile-container">
    <section class="profile-card" aria-labelledby="username">
        <p class="eyebrow">YOUR RESEARCH DESK</p>
        <div id="profileInitial" class="avatar" aria-hidden="true">R</div>
        <h1 id="username">Loading...</h1>
        <p id="email">Loading...</p>

        <div class="stats" aria-label="Your saved research">
            <div class="stat">
                <h2 id="bookmarkCount">0</h2>
                <span>Bookmarks</span>
            </div>
            <div class="stat">
                <h2 id="likeCount">0</h2>
                <span>Likes</span>
            </div>
        </div>

        <section class="subscription-section" aria-labelledby="digestHeading">
            <h2 id="digestHeading">Email Digest</h2>
            <p id="subscriptionStatus" role="status" aria-live="polite">Checking subscription...</p>
            <button id="subscriptionBtn" type="button">Subscribe</button>
        </section>

        <nav class="buttons" aria-label="Profile actions">
            <a class="profile-action" href="bookmarks.html">My Bookmarks</a>
            <a class="profile-action" href="likes.html">My Likes</a>
            <button id="logoutBtn" class="logout" type="button">Logout</button>
        </nav>
    </section>
</main>


<script src="config.js"></script>
<script src="api.js"></script>
<script src="profile.js"></script>

</body>

</html>
