<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | ReSight</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="shared.css">
</head>

<body class="login-page">
    <a class="auth-brand" href="home.html">ReSight<span>.</span></a>

    <form id="forgotForm" class="login-card">

        <h2>Forgot Password?</h2>

        <p>If your account is eligible, we’ll send a verification code to your email.</p>

        <input
            id="email"
            type="email"
            class="login-input"
            autocomplete="email"
            aria-label="Email"
            placeholder="Email"
            required
        >

        <button
            type="submit"
            class="login-btn"
        >
            Send OTP
        </button>

        <p id="message" role="status" aria-live="polite"></p>

        <p class="noacc">
            Remember your password?
            <a href="login.html" class="signup-link">Login</a>
        </p>

    </form>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="forgot-password.js"></script>

</body>

</html>
