<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Reset Code | ReSight</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="shared.css">
</head>

<body class="login-page">
    <a class="auth-brand" href="home.html">ReSight<span>.</span></a>

    <form id="otpForm" class="login-card">

        <h2>Enter OTP</h2>

        <p>We sent a 6-digit code to your email.</p>

        <input
            id="otp"
            type="text"
            class="login-input"
            placeholder="Enter OTP"
            maxlength="6"
            inputmode="numeric"
            pattern="[0-9]{6}"
            aria-label="Six-digit verification code"
            required
        >

        <button
            type="submit"
            class="login-btn"
        >
            Verify OTP
        </button>

        <p id="message" role="status" aria-live="polite"></p>

    </form>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="reset-otp.js"></script>

</body>

</html>
